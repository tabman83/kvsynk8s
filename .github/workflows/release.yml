name: Release

on:
  # A tag pushed by hand still works exactly as before.
  # v[0-9]* rather than v*, so a stray tag like "version-1.0" does not start a
  # release that then dies at `helm package` on an unparseable version.
  push:
    # Every merge to master publishes a dev prerelease. It never touches
    # :latest and never becomes "Latest release" on the repo page.
    branches:
      - master
    tags:
      - "v[0-9]*"
  # Or release from the Actions tab without touching git locally. The tag is
  # created by the release job at the end of this same run, so there is no
  # second workflow to trigger — which matters, because a tag pushed with
  # GITHUB_TOKEN would not start one anyway.
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, no leading v. Use 0.1.0, or 0.2.0-rc1 for a prerelease.'
        required: true
        type: string

permissions: {}

# One release at a time, repo-wide. Two overlapping runs would both call
# `imagetools create --tag latest` and the winner would be whichever finished
# last, not whichever is newer.
concurrency:
  # Stable releases serialise, so two of them can never race on :latest.
  # Dev builds get their own group and supersede each other: if three merges
  # land together only the newest dev build is worth having, and none of them
  # touch :latest, so cancelling an older one costs nothing.
  group: release-${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')) && 'dev' || 'stable' }}
  cancel-in-progress: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') }}

env:
  IMAGE: ghcr.io/tabman83/kvsynk8s
  # The chart is PACKAGED with a 3.x Helm, so the artifact stays readable by
  # every supported Helm, down to the >= 3.8 floor the chart documents. This is
  # not the floor itself, it is the latest 3.x. The `helm` job below validates
  # the chart on all three matrix legs: the 3.8 floor, the latest 3.x and the
  # latest 4.x.
  HELM_VERSION: v3.21.4

jobs:
  prepare:
    name: Work out what is being released
    permissions:
      contents: read
      # Read-only, so the overwrite guard below can see what is already
      # published under this version.
      packages: read
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
      channel: ${{ steps.resolve.outputs.channel }}
      latest: ${{ steps.latest.outputs.latest }}
    steps:
      # Full history so the dev build can find the last stable tag.
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Resolve the version
        id: resolve
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            # Run from the Actions tab: a stable release, version typed by hand.
            VERSION="$INPUT_VERSION"
            CHANNEL=stable
          elif [ "$REF_TYPE" = "tag" ]; then
            # Tag pushed by hand: a stable release.
            VERSION="${REF_NAME#v}"
            CHANNEL=stable
          else
            # Merge to master: a dev prerelease of the NEXT patch, so it sorts
            # below the release it is heading towards:
            #   0.1.1-dev.42 < 0.1.1-dev.43 < 0.1.1 < 0.1.2-dev.44
            LAST="$(git tag -l 'v[0-9]*' --sort=-v:refname | grep -v -- '-' | head -1)"
            if [ -n "$LAST" ]; then
              BASE_V="${LAST#v}"
              MAJOR="${BASE_V%%.*}"
              REST="${BASE_V#*.}"
              MINOR="${REST%%.*}"
              PATCH="${REST#*.}"
              BASE="${MAJOR}.${MINOR}.$((PATCH + 1))"
            else
              # Nothing released yet.
              BASE="0.1.0"
            fi
            VERSION="${BASE}-dev.${RUN_NUMBER}"
            CHANNEL=dev
          fi

          # No leading v, and no build metadata: OCI tags cannot contain "+",
          # and silently rewriting it would put a version in the registry that
          # does not match the one in Chart.yaml.
          if ! printf '%s' "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::'$VERSION' is not a version I can release. Expected X.Y.Z or X.Y.Z-suffix, with no leading v and no + build metadata." >&2
            exit 1
          fi

          # Rebuilding an already published version is guarded by
          # hack/check-release-overwrite.sh, two steps down — it needs the
          # registry as well as the git tag, so it cannot live here.

          # A semver prerelease suffix means: mark the GitHub Release as a
          # prerelease. Every dev build has one by construction. Whether
          # :latest moves is a separate, stricter question, answered by
          # hack/check-latest-eligible.sh in the next step.
          case "$VERSION" in
            *-*) PRERELEASE=true ;;
            *)   PRERELEASE=false ;;
          esac

          {
            echo "version=$VERSION"
            echo "tag=v$VERSION"
            echo "prerelease=$PRERELEASE"
            echo "channel=$CHANNEL"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Releasing \`v$VERSION\` ($CHANNEL)"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| chart / app version | \`$VERSION\` |"
            echo "| image tag | \`v$VERSION\` |"
            echo "| prerelease | \`$PRERELEASE\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      # Both guards below read the registry. The package is public, so an
      # anonymous read would usually work, but the credentials avoid anonymous
      # rate limiting and keep the guards working if the package is ever made
      # private. Stable only: every dev version carries this run's number, so
      # it is unique by construction and cannot collide with anything
      # published, and the :latest guard answers a dev build without reading
      # the registry at all.
      - name: Log in to GitHub Container Registry (to read what is published)
        if: steps.resolve.outputs.channel == 'stable'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Being a stable release is not enough to own :latest — it also has to be
      # the NEWEST stable release. Re-running an older one is legitimate and
      # must still rebuild its own versioned tag, but it must not drag :latest
      # backwards. The script explains the reasoning and warns when it says no.
      #
      # Runs after the login above: the guard's second witness is the image's
      # own published tags, so that a version whose release run died before
      # creating its git tag still counts as released. If it cannot read them
      # it says so and decides on the git tags alone.
      - name: Decide whether this release may move :latest
        id: latest
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
          IMAGE: ${{ env.IMAGE }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: hack/check-latest-eligible.sh "$VERSION" > /dev/null

      - name: Record the :latest decision in the summary
        env:
          MOVES: ${{ steps.latest.outputs.latest }}
        run: echo "| moves :latest | \`$([ "$MOVES" = true ] && echo yes || echo no)\` |" >> "$GITHUB_STEP_SUMMARY"

      # The git tag is written by the LAST job of this workflow, so a release
      # that died halfway leaves the image and the chart published under a
      # version with no tag. A tag-only guard cannot see that state, and would
      # wave through a dispatch of the same version from a different commit.
      - name: Refuse to rebuild a published version from a different commit
        if: steps.resolve.outputs.channel == 'stable'
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
          IMAGE: ${{ env.IMAGE }}
          # Which trigger this is decides whether the git tag counts as
          # evidence. On a dispatch the tag is written by the release job at the
          # end of this run, so an existing one means a release completed. On a
          # tag push the tag is the trigger, pushed by hand, and the guard has
          # to ask the registry instead. Same shape as the concurrency group
          # above: worked out inline from the event, not from a second copy of
          # the version-resolution logic.
          RELEASE_TRIGGER: ${{ github.event_name == 'workflow_dispatch' && 'dispatch' || 'tag' }}
        run: hack/check-release-overwrite.sh "$VERSION" "$GITHUB_SHA"

  test:
    permissions:
      contents: read
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod

      - name: Running Tests
        run: |
          go mod tidy
          make test

  lint:
    permissions:
      contents: read
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod

      - name: Check linter configuration
        run: make lint-config
      - name: Run linter
        run: make lint

  test-integration:
    permissions:
      contents: read
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod

      - name: Running integration tests (requires Docker, provided by ubuntu-latest)
        run: |
          go mod tidy
          make test-integration

  test-e2e:
    permissions:
      contents: read
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod

      - name: Install kind
        # Pinned like HELM_VERSION above, so a new kind release cannot change
        # CI under us. Bump deliberately, here and in test-e2e.yml together.
        env:
          KIND_VERSION: v0.32.0
        run: |
          curl -Lo ./kind "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-$(go env GOARCH)"
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

      - name: Verify kind installation
        run: kind version

      - name: Running Test e2e
        run: |
          go mod tidy
          make test-e2e

  helm:
    permissions:
      contents: read
    # Same matrix as helm.yml: the chart has to work on the >= 3.8 floor it
    # documents and on the Helm 4 line most people are on.
    name: Run on Ubuntu (helm ${{ matrix.helm }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        helm:
          - v3.8.2    # the >= 3.8 floor the chart documents
          - v3.21.4   # latest 3.x
          - v4.2.4    # latest 4.x
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod

      - name: Setup Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ matrix.helm }}

      - name: Make sure PyYAML is available
        run: |
          python3 -c 'import yaml' 2>/dev/null \
            || python3 -m pip install --quiet --break-system-packages pyyaml

      # `helm package` never executes templates, so without this a chart that
      # cannot render would still be packaged and pushed to GHCR by
      # publish-chart, and the release would go green.
      - name: Verify the chart
        run: |
          helm lint charts/kvsynk8s
          helm lint charts/kvsynk8s -f charts/kvsynk8s/ci/nondefault-values.yaml
          mkdir -p /tmp/render
          helm template kvsynk8s charts/kvsynk8s --namespace kvsynk8s > /tmp/render/default.yaml
          helm template kvsynk8s charts/kvsynk8s --namespace kvsynk8s \
            -f charts/kvsynk8s/ci/nondefault-values.yaml > /tmp/render/nondefault.yaml
          hack/check-render.sh /tmp/render/default.yaml /tmp/render/nondefault.yaml
          hack/check-values.sh

      # helm.yml runs this too, and calls it release-critical there: the image
      # is pushed as :vX.Y.Z while the chart is packaged with appVersion X.Y.Z,
      # so the chart has to put the "v" back. It is repeated here because this
      # workflow does not depend on helm.yml — a chart that lost the prefix
      # could be released green while helm.yml sat red on master, and every
      # default install of it would pull a tag that does not exist.
      - name: Default image tag resolves to the tag the release actually pushes
        run: |
          helm package charts/kvsynk8s --version 9.9.9 --app-version 9.9.9 --destination /tmp/pkg
          got="$(helm template kvsynk8s /tmp/pkg/kvsynk8s-9.9.9.tgz --namespace kvsynk8s \
                 | grep -m1 -oE 'ghcr\.io/tabman83/kvsynk8s:[^"]+')"
          echo "rendered image: $got"
          test "$got" = "ghcr.io/tabman83/kvsynk8s:v9.9.9"

      - name: Chart is in sync with the generated manifests
        run: |
          make manifests helm-sync
          git add -A charts/
          git diff --cached --exit-code charts/

      - name: Chart render matches the kustomize output
        run: make kustomize && KUSTOMIZE=bin/kustomize hack/compare-helm-kustomize.sh

  build-and-push:
    name: Build and push multi-arch image
    needs: [prepare, test, lint, test-integration, test-e2e, helm]
    permissions:
      contents: read
      packages: write
      # For the build provenance attestation below.
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GIT_REVISION becomes org.opencontainers.image.revision on the image.
      # Passed explicitly rather than left to the Makefile's `git rev-parse
      # HEAD` fallback, so the label records the commit this run was dispatched
      # for — which is exactly what hack/check-release-overwrite.sh compares
      # against on a later run.
      - name: Build and push the release image (multi-arch, via make docker-buildx)
        run: make docker-buildx IMG=${{ env.IMAGE }}:${{ needs.prepare.outputs.tag }} GIT_REVISION=${{ github.sha }}

      - name: Resolve the digest that was actually pushed
        id: image
        env:
          REF: ${{ env.IMAGE }}:${{ needs.prepare.outputs.tag }}
        run: |
          DIGEST="$(docker buildx imagetools inspect "$REF" --format '{{.Manifest.Digest}}')"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "$REF@$DIGEST"

      # Signed, verifiable statement of which workflow and which commit built
      # this image. Consumers can check it with:
      #   gh attestation verify oci://ghcr.io/tabman83/kvsynk8s:vX.Y.Z --repo tabman83/kvsynk8s
      - name: Attest the image build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

      # Only the newest stable release owns :latest — prepare worked that out,
      # see hack/check-latest-eligible.sh. Gating on `prerelease == false`
      # alone was not enough: a re-run of an older stable release passed it and
      # quietly pointed :latest at the older operator.
      - name: Tag the same manifest list as latest
        if: needs.prepare.outputs.latest == 'true'
        run: docker buildx imagetools create --tag ${{ env.IMAGE }}:latest ${{ env.IMAGE }}:${{ needs.prepare.outputs.tag }}

      # A prerelease skipping :latest is routine and needs no comment. A stable
      # release skipping it means someone re-ran an old release and should not
      # walk away thinking :latest now points at what they just built.
      - name: Say out loud that :latest was left alone
        if: needs.prepare.outputs.latest != 'true' && needs.prepare.outputs.prerelease == 'false'
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          IMAGE: ${{ env.IMAGE }}
        run: |
          echo "::warning title=latest tag was left alone::$TAG was rebuilt and pushed, but it is not the newest stable release, so $IMAGE:latest still points at the newer version."

      - name: Render the install manifest
        run: make build-installer IMG=${{ env.IMAGE }}:${{ needs.prepare.outputs.tag }}

      - name: Upload install.yaml
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: install-manifest
          path: dist/install.yaml
          if-no-files-found: error
          # Artifact names are unique per workflow RUN, not per attempt, so
          # without this a "Re-run all jobs" dies with a 409 instead of
          # converging the way the release contract says it does.
          overwrite: true

  publish-chart:
    name: Package and publish the Helm chart
    needs: [prepare, build-and-push]
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}

      # Chart.yaml stays at the 0.0.0 dev placeholder in git; the real version
      # only ever exists here, derived from the tag. Chart version == appVersion
      # == the tag minus the "v". The image above is pushed under the tag WITH
      # the "v", and the chart's default image.tag puts it back — helm.yml
      # asserts that, because a mismatch here breaks every default install.
      - name: Package the chart at the release version
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          helm package charts/kvsynk8s --version "$VERSION" --app-version "$VERSION"
          test -f "kvsynk8s-${VERSION}.tgz"

      # Two logins on purpose, because they write to different places.
      # `helm registry login` writes Helm's own registry config, which is what
      # `helm push` reads. The attestation step below is not helm: it resolves
      # registry credentials the Docker way, from ~/.docker/config.json, and
      # fails with "No credentials found for registry ghcr.io" without this.
      - name: Log in to GitHub Container Registry (for the attestation)
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to GitHub Container Registry (for helm push)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
        run: printf '%s' "$GH_TOKEN" | helm registry login ghcr.io -u "$GH_ACTOR" --password-stdin

      # OCI tags are mutable, so re-running the workflow on the same tag
      # republishes the same version cleanly instead of needing cleanup.
      - name: Push the chart to ghcr.io
        id: push
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          # pipefail, because the default shell for a `run:` block is `bash -e`
          # WITHOUT it: piping helm into tee would otherwise hand the step tee's
          # exit status, and a failed push would sail past. The digest grep is no
          # backstop either — registry errors routinely quote a blob URL with a
          # sha256 in it, which would be attested as if it were the chart.
          set -o pipefail
          # helm prints "Digest: sha256:..." on success; keep it for the attestation.
          helm push "kvsynk8s-${VERSION}.tgz" oci://ghcr.io/tabman83/charts 2>&1 | tee /tmp/push.log
          DIGEST="$(grep -oE 'sha256:[0-9a-f]{64}' /tmp/push.log | head -1)"
          test -n "$DIGEST" || { echo "::error::could not read the pushed chart digest" >&2; exit 1; }
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Attest the chart build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/tabman83/charts/kvsynk8s
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Upload the chart archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chart-package
          path: kvsynk8s-*.tgz
          if-no-files-found: error
          overwrite: true

  # Stable releases only. A dev build is published to the registry and stops
  # there: no git tag, no GitHub Release. Otherwise every merge would add an
  # entry and the releases page would be mostly noise. The dev image and chart
  # are still fully installable by version, and install.yaml is still rendered
  # and kept as a workflow artifact on the run.
  release:
    name: Create GitHub Release
    if: needs.prepare.outputs.channel == 'stable'
    needs: [prepare, build-and-push, publish-chart]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Download install.yaml
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: install-manifest
          path: dist

      - name: Download the chart archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: chart-package
          path: dist

      # On a workflow_dispatch run the tag does not exist yet: this step creates
      # it, pointing at the commit that was actually built. Doing it here rather
      # than up front means a failed release leaves no dangling tag behind.
      # On a tag-push run the tag already exists and this just reuses it.
      - name: Create release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ needs.prepare.outputs.prerelease }}
          # The same decision that gates the image's :latest tag
          # (hack/check-latest-eligible.sh). Left unset, the create-release API
          # defaults it to true, so releasing an older stable — a backport,
          # which this pipeline supports on purpose — would mark it "Latest
          # release" and make releases/latest/download/install.yaml serve the
          # OLD operator, while the image :latest correctly stayed put.
          make_latest: ${{ needs.prepare.outputs.latest }}
          files: |
            dist/install.yaml
            dist/kvsynk8s-*.tgz
          generate_release_notes: true
