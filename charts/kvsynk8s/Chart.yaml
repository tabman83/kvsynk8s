apiVersion: v2
name: kvsynk8s
description: Realtime sync from Azure Key Vault to Kubernetes secrets
type: application

# Dev placeholders. The release pipeline overrides both with the git tag
# (minus the leading "v") via `helm package --version --app-version`, so
# nothing ever rewrites this file in git. See specs/002-helm-chart/research.md R4.
version: 0.0.0
appVersion: "0.0.0"

home: https://github.com/tabman83/kvsynk8s
sources:
  - https://github.com/tabman83/kvsynk8s
keywords:
  - azure
  - key-vault
  - secrets
  - operator
maintainers:
  - name: tabman83
    url: https://github.com/tabman83

# helm push copies these into the OCI manifest. image.source links the
# published package to this repository, so it shows up on the repo page and
# inherits the repository's public visibility. This is what makes the package
# come out public on first publish — no manual step in the package settings
# is needed. Verified on the first dev build; see
# specs/002-helm-chart/contracts/release-artifacts.md, "Package visibility".
annotations:
  org.opencontainers.image.source: https://github.com/tabman83/kvsynk8s
