apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kvsynk8s.name" (dict "ctx" . "suffix" "operator") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kvsynk8s.workloadLabels" . | nindent 4 }}
spec:
  # Not a value, on purpose. The operator runs with leader election disabled
  # (cmd/main.go hardcodes LeaderElection: false), so a second replica would
  # reconcile the same SecretSync objects and write the same Secrets
  # uncoordinated. One replica is the correct number here.
  replicas: 1
  selector:
    matchLabels:
      {{- include "kvsynk8s.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
      labels:
        {{- include "kvsynk8s.selectorLabels" . | nindent 8 }}
        {{- if .Values.azure.clientID }}
        {{- /*
          Tells the Workload Identity webhook to project an Entra token into
          this pod. Rendered only when azure.clientID is set, together with the
          ServiceAccount annotation and the --azure-client-id arg (FR-011).
        */}}
        azure.workload.identity/use: "true"
        {{- end }}
    spec:
      serviceAccountName: {{ include "kvsynk8s.serviceAccountName" . }}
      terminationGracePeriodSeconds: 10
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: manager
        {{- /*
          image.tag empty falls back to the chart's appVersion, which the
          release pipeline sets to the tag minus the leading "v" (1.4.2).
          The image itself is pushed under the tag WITH the v (v1.4.2), so the
          v has to go back on here or a default install pulls a tag that does
          not exist. trimPrefix keeps it right even if appVersion already has it.
        */}}
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default (printf "v%s" (.Chart.AppVersion | trimPrefix "v")) }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        command:
        - /manager
        args:
        {{- if .Values.metrics.enabled }}
        - --metrics-bind-address=:8443
        {{- end }}
        {{- /*
          --leader-elect is kept for byte-equivalence with the install.yaml
          manifest install. The operator parses the flag and then ignores it:
          cmd/main.go always starts the manager with LeaderElection: false.
          Do not read it as leader election being on, and do not drop it —
          hack/compare-helm-kustomize.sh fails if it disappears.
        */}}
        - --leader-elect
        - --health-probe-bind-address=:8081
        {{- /*
          Quoted through `quote` so a value with YAML-significant characters in
          it cannot break the manifest or inject extra args.
        */}}
        {{- if .Values.operator.queueURL }}
        - {{ printf "--queue-url=%s" .Values.operator.queueURL | quote }}
        {{- end }}
        {{- if .Values.operator.reconcileInterval }}
        - {{ printf "--reconcile-interval=%s" .Values.operator.reconcileInterval | quote }}
        {{- end }}
        {{- if .Values.azure.clientID }}
        - {{ printf "--azure-client-id=%s" .Values.azure.clientID | quote }}
        {{- end }}
        ports:
        - containerPort: 8081
          name: health
          protocol: TCP
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - "ALL"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
