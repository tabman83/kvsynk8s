{{- if .Values.metrics.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kvsynk8s.name" (dict "ctx" . "suffix" "controller-manager-metrics-service") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kvsynk8s.workloadLabels" . | nindent 4 }}
spec:
  ports:
  - name: https
    port: 8443
    protocol: TCP
    targetPort: 8443
  selector:
    {{- include "kvsynk8s.selectorLabels" . | nindent 4 }}
{{- end }}
