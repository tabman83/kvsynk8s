apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "kvsynk8s.name" (dict "ctx" . "suffix" "manager-rolebinding") }}
  labels:
    {{- include "kvsynk8s.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "kvsynk8s.name" (dict "ctx" . "suffix" "manager-role") }}
subjects:
- kind: ServiceAccount
  name: {{ include "kvsynk8s.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
