{{- if .Values.metrics.enabled }}
{{/*
Not bound to anything by this chart. It exists so a cluster admin can grant
"may scrape /metrics" to a Prometheus ServiceAccount without writing the rule
by hand. Mirrored from config/rbac/metrics_reader_role.yaml.
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kvsynk8s.name" (dict "ctx" . "suffix" "metrics-reader") }}
  labels:
    {{- include "kvsynk8s.labels" . | nindent 4 }}
rules:
- nonResourceURLs:
  - "/metrics"
  verbs:
  - get
{{- end }}
