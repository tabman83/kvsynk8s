{{/*
Not used by the operator itself. Scaffolded helper roles a cluster admin can
bind to users or groups. Mirrored from config/rbac/secretsync_admin_role.yaml.

Admin: full permissions over kvsynk8s.io, for people who may delegate access.
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kvsynk8s.name" (dict "ctx" . "suffix" "secretsync-admin-role") }}
  labels:
    {{- include "kvsynk8s.labels" . | nindent 4 }}
rules:
- apiGroups:
  - kvsynk8s.io
  resources:
  - secretsyncs
  verbs:
  - '*'
- apiGroups:
  - kvsynk8s.io
  resources:
  - secretsyncs/status
  verbs:
  - get
