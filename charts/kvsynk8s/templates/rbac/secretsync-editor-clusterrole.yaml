{{/*
Not used by the operator itself. Scaffolded helper role a cluster admin can
bind to users or groups. Mirrored from config/rbac/secretsync_editor_role.yaml.

Editor: create/update/delete SecretSync objects, no control over RBAC.
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kvsynk8s.name" (dict "ctx" . "suffix" "secretsync-editor-role") }}
  labels:
    {{- include "kvsynk8s.labels" . | nindent 4 }}
rules:
- apiGroups:
  - kvsynk8s.io
  resources:
  - secretsyncs
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - kvsynk8s.io
  resources:
  - secretsyncs/status
  verbs:
  - get
