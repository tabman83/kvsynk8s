{{/*
Not used by the operator itself. Scaffolded helper role a cluster admin can
bind to users or groups. Mirrored from config/rbac/secretsync_viewer_role.yaml.

Viewer: read-only access to SecretSync objects.
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kvsynk8s.name" (dict "ctx" . "suffix" "secretsync-viewer-role") }}
  labels:
    {{- include "kvsynk8s.labels" . | nindent 4 }}
rules:
- apiGroups:
  - kvsynk8s.io
  resources:
  - secretsyncs
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - kvsynk8s.io
  resources:
  - secretsyncs/status
  verbs:
  - get
