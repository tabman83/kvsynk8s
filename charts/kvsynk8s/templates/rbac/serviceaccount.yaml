apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "kvsynk8s.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kvsynk8s.labels" . | nindent 4 }}
  {{- if .Values.azure.clientID }}
  annotations:
    {{- /*
      The federated credential on the managed identity must be bound to exactly
      system:serviceaccount:<this namespace>:<this ServiceAccount name>, or the
      operator cannot get an Entra token. See the warning in values.yaml.
    */}}
    azure.workload.identity/client-id: {{ .Values.azure.clientID | quote }}
  {{- end }}
