---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: secretsyncs.kvsynk8s.io
spec:
  group: kvsynk8s.io
  names:
    kind: SecretSync
    listKind: SecretSyncList
    plural: secretsyncs
    shortNames:
    - ss
    singular: secretsync
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.vault.name
      name: Vault
      type: string
    - jsonPath: .spec.vault.secret
      name: Secret
      type: string
    - jsonPath: .status.state
      name: State
      type: string
    - jsonPath: .status.syncedVersion
      name: Version
      type: string
    - jsonPath: .status.lastSyncTime
      name: Last Sync
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: SecretSync is the Schema for the secretsyncs API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of SecretSync
            properties:
              target:
                description: target describes the Kubernetes Secret produced from
                  the vault secret.
                properties:
                  dataKey:
                    description: |-
                      dataKey is the key under .data to store the value in. Defaults to the
                      vault secret name when empty. This default is applied by the
                      controller at reconcile time, not by the CRD schema.
                    maxLength: 253
                    pattern: ^[-._a-zA-Z0-9]+$
                    type: string
                  secretName:
                    description: |-
                      secretName is the name of the Kubernetes Secret to create in this
                      namespace. Defaults to the SecretSync's own name when empty. This
                      default is applied by the controller at reconcile time, not by the CRD
                      schema.
                    maxLength: 253
                    pattern: ^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$
                    type: string
                type: object
              vault:
                description: vault identifies the source Key Vault secret.
                properties:
                  name:
                    description: name is the name of the Azure Key Vault (not the
                      full URI).
                    maxLength: 24
                    minLength: 3
                    pattern: ^[a-zA-Z][a-zA-Z0-9-]+$
                    type: string
                  secret:
                    description: secret is the name of the secret inside the vault.
                    maxLength: 127
                    minLength: 1
                    pattern: ^[a-zA-Z0-9-]+$
                    type: string
                required:
                - name
                - secret
                type: object
            required:
            - vault
            type: object
          status:
            description: status defines the observed state of SecretSync
            properties:
              lastSyncTime:
                description: lastSyncTime is the time of the last successful write/verify.
                format: date-time
                type: string
              message:
                description: |-
                  message is a human-readable detail. It MUST never contain a secret
                  value (constitution principle I, FR-010).
                type: string
              observedGeneration:
                description: |-
                  observedGeneration is the generation of the spec last processed by the
                  controller.
                format: int64
                type: integer
              reason:
                description: |-
                  reason is a machine-readable failure reason. Known values: SecretNotFound,
                  AccessDenied, TargetConflict, SourceDeleted, SourceDisabled, TransientError.
                type: string
              state:
                description: state is the current high level sync state.
                enum:
                - Pending
                - InSync
                - Failing
                type: string
              syncedVersion:
                description: |-
                  syncedVersion is the Key Vault secret version currently reflected by
                  the managed Secret. It is an identifier, never a value, and is safe
                  to expose (constitution principle I).
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
