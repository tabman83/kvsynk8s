# Contract: SecretSync CustomResourceDefinition (operator-facing API)
# This is the contract users program against. The implementation generates the
# CRD from the Go types in api/v1alpha1 (controller-gen); generated output must
# stay compatible with this schema. Breaking changes require a new API version.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: secretsyncs.kvsynk8s.io
spec:
  group: kvsynk8s.io
  scope: Namespaced
  names:
    kind: SecretSync
    listKind: SecretSyncList
    plural: secretsyncs
    singular: secretsync
    shortNames: [ss]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Vault
          type: string
          jsonPath: .spec.vault.name
        - name: Secret
          type: string
          jsonPath: .spec.vault.secret
        - name: State
          type: string
          jsonPath: .status.state
        - name: Version
          type: string
          jsonPath: .status.syncedVersion
        - name: Last Sync
          type: date
          jsonPath: .status.lastSyncTime
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [vault]
              properties:
                vault:
                  type: object
                  required: [name, secret]
                  properties:
                    name:
                      type: string
                      minLength: 3
                      maxLength: 24
                      pattern: "^[a-zA-Z][a-zA-Z0-9-]+$"
                      description: Name of the Azure Key Vault (not the full URI).
                    secret:
                      type: string
                      minLength: 1
                      maxLength: 127
                      pattern: "^[a-zA-Z0-9-]+$"
                      description: Name of the secret inside the vault.
                target:
                  type: object
                  properties:
                    secretName:
                      type: string
                      maxLength: 253
                      pattern: "^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$"
                      description: >-
                        Name of the Kubernetes Secret to create in this
                        namespace. Defaults to the SecretSync's own name.
                        The pattern is a full DNS-1123 subdomain, matching what
                        the API server enforces on the Secret's metadata.name.
                    dataKey:
                      type: string
                      maxLength: 253
                      pattern: "^[-._a-zA-Z0-9]+$"
                      x-kubernetes-validations:
                        - rule: "self != '.' && !self.startsWith('..')"
                          message: >-
                            dataKey must not be '.' or start with '..' (not a
                            valid Secret data key)
                      description: >-
                        Key under .data to store the value in. Defaults to the
                        vault secret name.
                        The pattern alone is not enough: it admits ".", ".."
                        and any ".."-prefixed key, all of which apimachinery's
                        IsConfigMapKey rejects when the Secret is written. A
                        SecretSync carrying one would sit at Pending forever
                        with a Secret that can never be created, so the rule
                        refuses it at admission instead.
            status:
              type: object
              properties:
                state:
                  type: string
                  enum: [Pending, InSync, Failing]
                lastSyncTime:
                  type: string
                  format: date-time
                syncedVersion:
                  type: string
                  description: Key Vault version identifier currently synced (never a value).
                reason:
                  type: string
                  description: >-
                    Machine-readable failure reason. Known values:
                    SecretNotFound, AccessDenied, TargetConflict,
                    SourceDeleted, SourceDisabled, TransientError.
                message:
                  type: string
                  description: Human-readable detail. Must never contain a secret value.
                observedGeneration:
                  type: integer
                  format: int64
